name: jardem_citizen
description: "Jardem.ai — citizen app: call an emergency service in Almaty and track the crew (demo)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  jardem_core:
    path: ../packages/jardem_core
  flutter_map: ^8.3.2
  flutter_riverpod: ^2.6.1
  geolocator: ^14.1.1
  go_router: ^17.5.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
