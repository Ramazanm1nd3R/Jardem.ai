# Single entry point of the cluster: site, both apps and the API on one origin.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    # nginx's stock mime.types has no entry for ES-module files.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /app/citizen/ {
        alias /srv/citizen/;
        try_files $uri $uri/ /app/citizen/index.html;
    }
    location /app/responder/ {
        alias /srv/responder/;
        try_files $uri $uri/ /app/responder/index.html;
    }
    location = /app/citizen { return 301 /app/citizen/; }
    location = /app/responder { return 301 /app/responder/; }

    location / {
        root /srv/web;
        try_files $uri $uri/ /index.html;
    }
}
